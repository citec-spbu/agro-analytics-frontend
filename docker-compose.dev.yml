# Разработка полностью в Docker: Vite + HMR, без nginx и без npm на хосте.
# Зависимости ставятся в volume node_modules внутри контейнера.
#
# Перед запуском остановите прод-контейнер (тот же порт 9001):
#   docker stop agro-analytics-frontend
#
# Запуск (из каталога agro-analytics-frontend):
#   docker compose -f docker-compose.dev.yml up
#
# После смены package-lock.json при необходимости:
#   docker compose -f docker-compose.dev.yml run --rm analytics-frontend-dev npm ci

services:
  analytics-frontend-dev:
    image: node:20-alpine
    container_name: agro-analytics-frontend-dev
    working_dir: /app
    volumes:
      - .:/app
      - analytics_frontend_modules:/app/node_modules
    ports:
      - '9001:9001'
    environment:
      VITE_POLL: '1'
    entrypoint: ["/bin/sh", "/app/scripts/docker-dev-entry.sh"]
    networks:
      - default

volumes:
  analytics_frontend_modules:

networks:
  default:
    name: agronetwork
    external: true
