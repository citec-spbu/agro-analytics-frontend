# Фронтенд аналитики (отдельное SPA): http://localhost:9001 (с хоста браузера).
# Сеть agronetwork — как у остальных сервисов (docker network create agronetwork).
#
# Прод (nginx, нужна пересборка образа после правок):
#   docker compose up -d --build
#
# Разработка только в Docker (Vite + HMR, без npm на хосте):
#   docker stop agro-analytics-frontend
#   docker compose -f docker-compose.dev.yml up
#   # или: npm run dev:docker
#
# Чтобы в хосте открывался iframe с этим приложением, задайте в билде хоста:
#   VUE_APP_ANALYTICS_MFE_URL=http://localhost:9001
# Без этой переменной хост показывает встроенный AnalyticsDashboard.vue — правки в
# agro-analytics-frontend/src/* на странице аналитики не видны.

services:
  analytics-frontend:
    build: .
    container_name: agro-analytics-frontend
    ports:
      - "9001:80"
    restart: unless-stopped

networks:
  default:
    name: agronetwork
    external: true
